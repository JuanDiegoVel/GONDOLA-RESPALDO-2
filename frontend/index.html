  </div>`;
}

// Estilos del mapa de calor: heatmap.js no solo pinta colores distintos
// con la opcion `gradient` (stop 0-1 -> color), tambien cambia de "sentir"
// segun el radio de cada punto y cuanto se difumina (`blur`). Cada estilo
// de aqui cambia las dos cosas a la vez -no solo repintar el mismo blob
// con otro color-, para que se note una diferencia real al cambiar:
//   - clasico: el de siempre (heatmap.js sin `gradient` propio).
//   - azul: un solo tono (el azul de marca), mas discreto.
//   - contraste: puntos mas chicos y sin difuminar casi nada -sirve para
//     ubicar el punto exacto de mayor concentracion, no la forma general-.
//   - suave: puntos grandes y muy difuminados -sirve para ver el patron
//     general de circulacion, no puntos exactos-.
// `legendCss` es el MISMO degradado, pero como string de CSS para pintar
// la barra "Menos -> Mas": tiene que coincidir con `gradient` a mano
// porque heatmap.js y `background: linear-gradient()` no comparten formato.
const HEATMAP_ESTILOS = {
  clasico: {
    label: 'Clásico',
    radiusFactor: 0.035, radiusMin: 16, blur: 0.85, maxOpacity: 0.9, minOpacity: 0,
    gradient: undefined, // heatmap.js sin `gradient` usa el suyo (azul->cian->verde->amarillo->rojo)
    legendCss: 'linear-gradient(90deg,#0B1220,#1F6C9F,#5AD1E0,#FFF06B,#E0472C)',
  },
  azul: {
    label: 'Monocromático',
    radiusFactor: 0.035, radiusMin: 16, blur: 0.85, maxOpacity: 0.85, minOpacity: 0,
    gradient: { 0.2: 'rgba(31,108,159,0.25)', 0.4: 'rgba(31,108,159,0.55)', 0.65: '#1F6C9F', 0.85: '#18567D', 1.0: '#0B3B5C' },
    legendCss: 'linear-gradient(90deg,rgba(31,108,159,0.2),#5CACD9,#1F6C9F,#0B3B5C)',
  },
  contraste: {
    label: 'Alto contraste',
    radiusFactor: 0.02, radiusMin: 9, blur: 0.35, maxOpacity: 1, minOpacity: 0.05,
    gradient: { 0.3: '#1F6C9F', 0.6: '#FFD400', 0.85: '#FF7A00', 1.0: '#E0472C' },
    legendCss: 'linear-gradient(90deg,#1F6C9F,#FFD400,#FF7A00,#E0472C)',
  },
  suave: {
    label: 'Difuminado',
    radiusFactor: 0.065, radiusMin: 30, blur: 0.97, maxOpacity: 0.7, minOpacity: 0,
    gradient: { 0.2: 'rgba(93,155,201,0.2)', 0.45: '#8FD3C9', 0.7: '#FFE08A', 1.0: '#F2A65A' },
    legendCss: 'linear-gradient(90deg,rgba(93,155,201,0.15),#8FD3C9,#FFE08A,#F2A65A)',
  },
};

// Intervalo de la animacion "viva" por contenedor (ver mas abajo): un
// mapa nombre-de-contenedor -> id de setInterval, para poder apagar el de
// una llamada anterior antes de prender uno nuevo. Sin esto, cada
// render() -que llama a pintarHeatmap() de nuevo, ver el final del
// archivo- dejaria un setInterval viejo corriendo para siempre sobre un
// <canvas> que ya no existe (pintarHeatmap borra el contenedor entero con
// container.innerHTML = '' en cada llamada).
const HEATMAP_TIMERS = {};

// Pinta heatmap.js dentro de #<containerId>. Se llama despues de cada
// render() (ver fillCountUps() mas abajo), nunca durante: heatmap.js
// necesita medir el contenedor ya insertado en el DOM (container.clientWidth)
// para saber a que escala de pixeles pintar. Recibe `positions` aparte (no
// state directamente) para poder pintar el mapa de CUALQUIER video -el
// principal o los de la comparacion-, cada uno en su propio contenedor.
function pintarHeatmap(containerId, positions) {
  if (HEATMAP_TIMERS[containerId]) { clearInterval(HEATMAP_TIMERS[containerId]); delete HEATMAP_TIMERS[containerId]; }
  const container = document.getElementById(containerId);
  if (!container || typeof h337 === 'undefined') return;
  const frameWidth = Number(container.dataset.frameWidth);
  const frameHeight = Number(container.dataset.frameHeight);
  if (!frameWidth || !frameHeight || !container.clientWidth) return;

  container.innerHTML = '';
  const estilo = HEATMAP_ESTILOS[state.heatmapStyle] || HEATMAP_ESTILOS.contraste;
  const configHeatmap = {
    container,
    radius: Math.max(estilo.radiusMin, Math.round(container.clientWidth * estilo.radiusFactor)),
    maxOpacity: estilo.maxOpacity,
    minOpacity: estilo.minOpacity,
    blur: estilo.blur,
  };
  if (estilo.gradient) configHeatmap.gradient = estilo.gradient;
  const heatmap = h337.create(configHeatmap);

  // heatmap.js pinta en pixeles de pantalla, no en pixeles del frame
  // original: hay que reescalar cada (x, y) a como se ve el contenedor
  // (que puede medir 640px de ancho para un frame de 1920px). Se agrupan
  // puntos que caen en el mismo pixel de pantalla (varios frames del mismo
  // track pasando por el mismo sitio) para que su "value" refleje
  // concentracion real, no un punto suelto por evento.
  const scaleX = container.clientWidth / frameWidth;
  const scaleY = container.clientHeight / frameHeight;
  const conteo = new Map();
  positions.forEach((p) => {
    const gx = Math.round(p.x * scaleX);
    const gy = Math.round(p.y * scaleY);
    const key = gx + ',' + gy;
    conteo.set(key, (conteo.get(key) || 0) + 1);
  });
  const data = Array.from(conteo, ([key, value]) => {
    const [x, y] = key.split(',').map(Number);
    return { x, y, value };
  });
  const max = Math.max(1, ...data.map((d) => d.value));
  heatmap.setData({ max, data });

  // "Vivo": cada punto flucti­a su intensidad por su cuenta (no toda la
  // imagen escalando junta, que se ve mecanico) -como el parpadeo de una
  // brasa-. Se re-jitterea el MISMO array de puntos cada ~200ms; nunca se
  // recalcula desde `positions`, asi que la posicion de cada zona caliente
  // no se mueve, solo su intensidad. Respeta prefers-reduced-motion, igual
  // que el resto del dashboard (ver el <style> de mas arriba).
  const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!sinMovimiento && data.length) {
    HEATMAP_TIMERS[containerId] = setInterval(() => {
      if (!document.getElementById(containerId)) { clearInterval(HEATMAP_TIMERS[containerId]); delete HEATMAP_TIMERS[containerId]; return; }
      const conJitter = data.map((d) => ({ x: d.x, y: d.y, value: Math.max(1, d.value * (0.7 + Math.random() * 0.6)) }));
      heatmap.setData({ max, data: conJitter });
    }, 220);
  }
}

function renderZonesHeatmap(bundle = bundleDe()) {
  const zones = bundle.hierarchy;
  if (bundle.isLoadingHierarchy) {
    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs">
      <div class="h-4 skeleton rounded w-48 mb-3"></div>
      <div class="h-40 skeleton rounded-lg"></div>
    </div>`;
  }
  if (!zones || zones.length === 0) {
    return `
    <div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] p-5 text-center text-xs text-[#787774]">
      Sin zonas configuradas todavía para este video.
    </div>`;
  }

  const metricsById = Object.fromEntries(bundle.metrics.map((m) => [m.zone_id, m]));
  const gondolas = zones.filter((z) => z.level === 'gondola');
  const shelvesByParent = {};
  zones.filter((z) => z.level === 'shelf').forEach((s) => {
    (shelvesByParent[s.parent_zone_id] ||= []).push(s);
  });

  const maxPeople = Math.max(1, ...zones.map((z) => (metricsById[z.zone_id] || {}).people_count || 0));
  const heatColor = (people) => {
    const t = Math.max(0, Math.min(1, people / maxPeople));
    const stops = t < 0.5
      ? [[214, 232, 245], [93, 155, 201], t / 0.5]
      : [[93, 155, 201], [11, 59, 92], (t - 0.5) / 0.5];
    const [a, b, local] = stops;
    const rgb = a.map((v, i) => Math.round(v + (b[i] - v) * local));
    return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  };

  const shelfRow = (s) => {
    const m = metricsById[s.zone_id] || {};
    return `
    <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 rounded px-3 py-2.5 mb-2 text-white text-xs" style="background:${heatColor(m.people_count || 0)}">
      <span class="font-semibold leading-snug">${esc(s.name)}</span>
      <span class="font-mono text-[11px] opacity-90 sm:ml-auto sm:text-right whitespace-nowrap">${formatNumber(m.people_count || 0)} pers · ${formatNumber(m.interaction_count || 0)} interac · ${formatDwellTime(m.average_dwell_time_s)}</span>
    </div>`;
  };

  const gondolaCard = (g) => {
    const m = metricsById[g.zone_id] || {};
    const shelves = shelvesByParent[g.zone_id] || [];
    const shelvesTotal = shelves.reduce((sum, s) => sum + ((metricsById[s.zone_id] || {}).people_count || 0), 0);
    const totalPeople = m.people_count || shelvesTotal;
    return `
    <div class="rounded-xl border border-[#EAEAEA] p-4 shadow-xs" style="background:linear-gradient(160deg,#FFFFFF 0%,#F3F2EF 100%)">
      <div class="flex items-baseline justify-between mb-3">
        <h4 class="text-sm font-bold text-[#111111]">${esc(g.name)}</h4>
        <span class="text-[11px] font-mono text-[#787774]">${formatNumber(totalPeople)} pers</span>
      </div>
      ${shelves.length ? shelves.map(shelfRow).join('') : `<div class="text-[11px] italic text-[#A8A29E]">Sin estantes configurados.</div>`}
    </div>`;
  };

  function renderRanking() {
    const compareList = zones.filter((z) => z.level === 'shelf').length
      ? zones.filter((z) => z.level === 'shelf')
      : zones;
    const withMetrics = compareList
      .map((z) => ({ ...z, m: metricsById[z.zone_id] || {} }))
      .sort((a, b) => (b.m.interaction_count || 0) - (a.m.interaction_count || 0));
    const maxInteraction = Math.max(1, ...withMetrics.map((z) => z.m.interaction_count || 0));

    const rows = withMetrics.map((z) => `
      <div class="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-3">
        <span class="text-xs text-[#57534E] leading-snug sm:w-40 sm:shrink-0" title="${esc(z.name)}">${esc(z.name)}</span>
        <div class="flex-1 flex items-center gap-2">
          <div class="flex-1 bg-[#F3F2EF] h-3 rounded-full overflow-hidden">
            <div class="h-full rounded-full" style="width:${Math.max(4, Math.round((z.m.interaction_count || 0) / maxInteraction * 100))}%;background:#1F6C9F"></div>
          </div>
          <span class="text-xs font-mono text-[#111111] w-8 text-right shrink-0">${formatNumber(z.m.interaction_count || 0)}</span>
        </div>
      </div>`).join('');

    return `
    <div class="bg-white rounded-xl border border-[#EAEAEA] p-5 shadow-xs space-y-3">
      <div>
        <h3 class="text-sm font-bold text-[#111111]">Ranking de zonas por interacción</h3>
        <p class="text-[11px] text-[#787774]">Cuál estante genera más paradas de cliente, de mayor a menor</p>
      </div>
      <div class="space-y-2.5">${rows}</div>
    </div>`;
  }

  return `
  <div class="space-y-4">
    <div class="rounded-xl border border-[#EAEAEA] p-5 shadow-xs" style="background:linear-gradient(165deg,#FFFFFF 0%,#EEF1F0 100%)">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-[#F3F2EF] text-[#787774] flex items-center justify-center shrink-0">${icon('map', 'w-4 h-4')}</div>
          <div>
            <h3 class="text-sm font-bold text-[#111111]">Resumen por Zona</h3>
            <p class="text-[11px] text-[#787774]">Total agregado por góndola/estante — el mapa de calor por coordenadas está arriba</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 text-[10px] text-[#787774]">
          <span>Menos</span><div class="w-24 h-2 rounded" style="background:linear-gradient(90deg,#D6E8F5,#5D9BC9,#0B3B5C)"></div><span>Más</span>
        </div>
      </div>
      <div class="grid gap-3.5 grid-cols-1 md:grid-cols-2 mt-3">${gondolas.map(gondolaCard).join('')}</div>
    </div>
    ${renderRanking()}
  </div>`;
}

// Diagnostico automatico ("Space Management en 10 segundos"): reglas
// simples sobre los numeros ya calculados (nada de IA ni llamada extra a la
// API) que arman 2-4 tarjetas de texto con una lectura y una accion
// sugerida. Vive en la columna DERECHA del dashboard (ver render() mas
// abajo), debajo de "Privacidad y Ética".
function renderInsights() {
  if (!state.videoDetail) return '';
  const d = state.videoDetail;
  const zones = state.zoneMetrics;
  const engagementRatio = d.people_count > 0 ? d.interaction_count / d.people_count : 0;
  const hasPickUps = d.pick_up_count > 0;
  const rejectionRatio = hasPickUps ? d.put_back_count / d.pick_up_count : 0;
  const dwell = d.average_dwell_time_s || 0;

  const list = [];
  if (d.people_count === 0) {
    list.push({ type: 'neutral', title: 'Sin tránsito en el pasillo', desc: 'No se detectaron personas durante este periodo de grabación.', action: 'Evaluar iluminación de cabecera o señalética direccional de pasillo.' });
  } else if (engagementRatio >= 0.8) {
    list.push({ type: 'success', title: 'Alta atracción de clientes al expositor', desc: `Un promedio de ${engagementRatio.toFixed(1)} interacciones por transeúnte con permanencia media de ${formatDwellTime(dwell)}.`, action: 'Mantener la posición de categoría; los clientes se detienen con naturalidad frente a este espacio.' });
  } else if (engagementRatio < 0.4) {
    list.push({ type: 'attention', title: 'Tráfico de paso rápido (Baja detención)', desc: 'La mayoría de personas circulan frente a la góndola sin detenerse ni interactuar.', action: 'Considerar productos gancho o cartelería promocional a la altura de los ojos (1.40m - 1.60m) para frenar el paso.' });
  }
  if (hasPickUps) {
    if (rejectionRatio > 0.4) {
      list.push({ type: 'attention', title: `Fricción de compra: ${Math.round(rejectionRatio * 100)}% de tomas devueltas`, desc: `De ${d.pick_up_count} tomas registradas, ${d.put_back_count} fueron devueltas a la góndola sin compra.`, action: 'Verificar claridad de etiquetas de precio, empaques dañados o información nutricional confusa en los estantes.' });
    } else if (d.put_back_count === 0) {
      list.push({ type: 'success', title: 'Decisión directa: 0% devoluciones', desc: `Todas las ${d.pick_up_count} tomas de producto se mantuvieron en poder del cliente.`, action: 'Planograma óptimo: la presentación del producto genera convicción inmediata en el comprador.' });
    }
  } else if (d.interaction_count > 5 && d.pick_up_count === 0) {
    list.push({ type: 'attention', title: 'Interacción visual sin contacto físico', desc: 'Los clientes se detienen frente a la góndola pero no toman ningún artículo con las manos.', action: 'Revisar accesibilidad física del estante y visibilidad frontal del surtido.' });
  }
  if (zones.length > 1) {
    const bestZone = [...zones].sort((a, b) => (b.conversion_rate || 0) - (a.conversion_rate || 0))[0];
    if (bestZone && (bestZone.conversion_rate || 0) > 0) {
      list.push({ type: 'success', title: `Zona líder en conversión: ${bestZone.name}`, desc: `Registró la mayor tasa de conversión (${formatPercentage(bestZone.conversion_rate)}) entre los estantes analizados.`, action: `Aprovechar el nivel '${bestZone.level}' para productos de mayor margen comercial o lanzamientos.` });
    }
  }

  const cards = list.map((rec) => {
    const isSuccess = rec.type === 'success';
    const isAttention = rec.type === 'attention';
    const cls = isSuccess ? 'bg-[#EDF3EC]/60 border-[#C7D6C5] text-[#346538]' : isAttention ? 'bg-[#FBF3DB]/40 border-[#EDD9A3] text-[#956400]' : 'bg-[#F7F6F3] border-[#EAEAEA] text-[#2F3437]';
    const iconHtml = isSuccess ? icon('check-circle-2', 'w-3.5 h-3.5 text-[#2B5230] shrink-0') : isAttention ? icon('alert-circle', 'w-3.5 h-3.5 text-[#956400] shrink-0') : icon('lightbulb', 'w-3.5 h-3.5 text-[#787774] shrink-0');
    return `
    <div class="rounded-lg p-3 border flex flex-col justify-between ${cls}">
      <div>
        <div class="flex items-center gap-1.5 mb-1.5">${iconHtml}<h4 class="text-xs font-bold leading-tight text-[#111111]">${esc(rec.title)}</h4></div>
        <p class="text-[11px] text-[#57534E] leading-relaxed mb-2.5">${esc(rec.desc)}</p>
      </div>
      <div class="pt-2 border-t border-black/5 flex items-start gap-1.5 text-[11px]">
        ${icon('arrow-right', 'w-3 h-3 text-[#1F6C9F] shrink-0 mt-0.5')}
        <span class="text-[#44403C]"><strong class="text-[#111111]">Acción:</strong> ${esc(rec.action)}</span>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="bg-white rounded-xl border border-[#EAEAEA] p-4.5 shadow-xs space-y-3.5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#F3F2EF] pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-[#1F6C9F]/10 text-[#1F6C9F] flex items-center justify-center shrink-0">${icon('compass', 'w-4 h-4')}</div>
        <div>
          <h3 class="text-sm font-bold text-[#111111]">Diagnóstico de Space Management en 10 Segundos</h3>
          <p class="text-[11px] text-[#787774]">Síntesis ejecutiva de comportamiento para gerencia de tienda y planogramación</p>
        </div>
      </div>
      <div class="inline-flex items-center gap-1.5 text-[11px] text-[#787774] bg-[#F7F6F3] px-2.5 py-1 rounded-md border border-[#EAEAEA]">
        ${icon('trending-up', 'w-3.5 h-3.5 text-[#1F6C9F]')}<span>Telemetría de video anónima</span>
      </div>
    </div>
    <div class="grid grid-cols-1 gap-3">${cards}</div>
  </div>`;
}

function errorAlert({ title, detail, retryAction, showMock = true, isRetrying = false }) {
  return `
  <div class="bg-white rounded-xl border border-red-200 p-6 shadow-xs my-4 space-y-4">
    <div class="flex items-start gap-3">

// --------------------------------------------------------------------------
// Fondo animado de TODO el dashboard: una constelacion de particulas en
// tonos pasteles, muy tenue, para que se sienta vivo sin robarle
// legibilidad a los datos. Vive en su propio <canvas> (fuera de #root, ver
// el <body> mas arriba) y se arranca UNA sola vez al cargar la pagina,
// nunca se reinicia -si viviera dentro de #root, cada render() (que pasa
// docenas de veces por sesion: cambiar de video, abrir un modal) la
// reiniciaria desde cero, perdiendo las particulas ya en pantalla-.
// Fusionada desde una version paralela del dashboard (ver el comentario
// grande del <canvas>): la unica adaptacion real fue leer el tema oscuro
// de `document.documentElement.classList.contains('dark')` -el mecanismo
// de ESTE archivo (ver toggle-dark-mode)- en vez de `body.dark-mode`, que
// era como lo resolvia el archivo original.
// --------------------------------------------------------------------------
let pageParticles = null;

function initPageParticles() {
  const canvas = document.getElementById('page-particles');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  function resize() {
    // Tamano visible (canvas.style.width/height, en pixeles literales) y
    // resolucion interna (canvas.width/height) con el MISMO numero exacto:
    // si uno fuera un porcentaje y el otro pixeles, el navegador reescala
    // el dibujo para que quepa, "encogiendo" la animacion hacia una
    // esquina. Con los dos en pixeles literales no hay reescalado posible.
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w;
    canvas.height = h;
  }
  resize();
  window.addEventListener('resize', resize);

  // Dos paletas: pastel para tema claro (discreta, no compite con los
  // datos) y mas vivida para tema oscuro (los tonos pastel casi no se ven
  // sobre fondo oscuro). Cada punto guarda solo un INDICE de color (0-3),
  // no el color en si: si el usuario cambia de tema a mitad de la
  // animacion, el siguiente cuadro ya pinta con la paleta correcta sin
  // tener que recrear los puntos.
  const LIGHT_PALETTE = ['#FFC24D', '#6FAFDB', '#E091C7', '#9C86D9'];
  const DARK_PALETTE  = ['#FFC24D', '#FF6FC0', '#4FC3E8', '#B18CFF'];
  const count = Math.min(160, Math.max(60, Math.round((window.innerWidth * window.innerHeight) / 13000)));
  pageParticles = Array.from({ length: count }).map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.34,
    vy: (Math.random() - 0.5) * 0.28,
    r: Math.random() * 2.2 + 1.7,
    hue: Math.floor(Math.random() * 4),
  }));

  function tick() {
    const dark = document.documentElement.classList.contains('dark');
    const palette = dark ? DARK_PALETTE : LIGHT_PALETTE;
    const lineRGB = dark ? '255,255,255' : '31,41,55';
    const lineAlpha = dark ? 0.24 : 0.16;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of pageParticles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    }

    // Lineas entre particulas cercanas: se notan en los huecos entre
    // tarjetas, sin competir con el texto de encima.
    for (let i = 0; i < pageParticles.length; i++) {
      for (let j = i + 1; j < pageParticles.length; j++) {
        const a = pageParticles[i], b = pageParticles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          ctx.strokeStyle = `rgba(${lineRGB},${lineAlpha * (1 - dist / 150)})`;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    for (const p of pageParticles) {
      const color = palette[p.hue];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color + '70';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // prefers-reduced-motion: se pinta un solo cuadro estatico (no un
    // canvas vacio) y no se programa el siguiente -mismo criterio que el
    // parpadeo del mapa de calor, ver pintarHeatmap()-.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(tick);
  }
  tick();
}

// ==========================================================================
// SUBIR UN VIDEO (portado de una version paralela del dashboard, hecha por
// un companero de equipo -ver backend/uploads.py para el lado servidor-).
// --------------------------------------------------------------------------
// Seis pasos, uno por pantalla del mismo modal:
//   terminos -> subiendo -> revisando -> zonas -> procesando -> listo
//                                    \-> rechazado
//
// El paso "zonas" no se puede saltar: las zonas son rectangulos en pixeles
// de UNA camara concreta (ver docs/zones-format.md), y un video que sube
// alguien viene de otra. Sin ese dibujo, el backend no puede medir por
// estante -y su importador se niega a importar-. Es preferible pedir treinta
// segundos de calibracion que inventar unas zonas por defecto y mostrar
// metricas por estante que no significan nada.
// ==========================================================================

// El frame de fondo y el temporizador de sondeo viven FUERA de state: son un
// objeto Image() y un id de setTimeout, no datos que la interfaz pinte, y
// meterlos en state solo haria ruido en cada setState().
let imagenCalibracion = null;
let sondeoSubida = null;

// sondearTrabajo() llama a setState() cada 2s mientras el prevuelo/proceso
// esta en marcha, y setState() reconstruye el modal ENTERO
// (#modals-portal.innerHTML = ...) en cada vuelta -incluidas las clases
// 'modal-backdrop'/'modal-anim', que traen una animacion de ENTRADA (fade
// + escala). Al recrear el mismo nodo con las mismas clases cada 2s, el
// navegador vuelve a disparar esa animacion de entrada una y otra vez: el
// modal "parpadea" (se ve pestanear) todo el tiempo que dura la subida,
// no solo al abrirse -bug real, reportado en la practica-. Con esta bandera
// la animacion de entrada se pinta SOLO la primera vez que el modal
// aparece en pantalla; los repintados de despues (con contenido
// actualizado: la barra de progreso, el mensaje) no vuelven a animarse.
let subidaYaAnimada = false;

function abrirSubida() {
  imagenCalibracion = null;
  subidaYaAnimada = false;
  setState({ subida: { ...SUBIDA_VACIA(), abierto: true } });
}

function cerrarSubida() {
  clearTimeout(sondeoSubida);
  sondeoSubida = null;
  imagenCalibracion = null;
  subidaYaAnimada = false;
  setState({ subida: SUBIDA_VACIA() });
}

function actualizarSubida(cambios) {
  setState({ subida: { ...state.subida, ...cambios } });
}

function terminosCompletos() {
  const t = state.subida.terminos;
  return t.gondola && t.privacidad && t.custodia;
}

function subirVideo() {
  const s = state.subida;
  if (!s.archivo || !terminosCompletos()) return;
  const datos = new FormData();
  datos.append('file', s.archivo);
  datos.append('acepta_terminos', 'true');
  datos.append('confirma_gondola', 'true');

  // XMLHttpRequest en vez de fetch() a proposito: fetch no sabe informar del
  // progreso de SUBIDA, y un video de decenas de MB sin barra parece colgado.
  const peticion = new XMLHttpRequest();
  peticion.open('POST', `${cleanBaseUrl(state.apiBaseUrl)}/uploads`);
  peticion.upload.onprogress = (e) => {
    if (e.lengthComputable) actualizarSubida({ pct: Math.round((e.loaded / e.total) * 100) });
  };
  peticion.onload = () => {
    let cuerpo = null;
    try { cuerpo = JSON.parse(peticion.responseText); } catch { /* respuesta no-JSON */ }
    if (peticion.status >= 400) {
      actualizarSubida({ paso: 'rechazado', error: (cuerpo && cuerpo.detail) || `El servidor respondió ${peticion.status}.` });
      return;
    }
    actualizarSubida({ paso: 'revisando', jobId: cuerpo.job_id, job: cuerpo, pct: 100 });
    sondearTrabajo();
  };
  peticion.onerror = () => actualizarSubida({
    paso: 'rechazado',
    error: `No se pudo contactar la API en ${state.apiBaseUrl}. ¿Está corriendo?`,
  });
  actualizarSubida({ paso: 'subiendo', pct: 0, error: null });
  peticion.send(datos);
}

async function sondearTrabajo() {
  const s = state.subida;
  if (!s.jobId) return;
  try {
    const job = await fetchFromApi(`${cleanBaseUrl(state.apiBaseUrl)}/uploads/${s.jobId}`);
    const siguiente = {
      esperando_zonas: 'zonas',
      procesando: 'procesando',
      listo: 'listo',
      rechazado: 'rechazado',
      error: 'rechazado',
    }[job.estado] || 'revisando';
    actualizarSubida({ job, paso: siguiente, error: siguiente === 'rechazado' ? job.mensaje : null });
    if (job.estado === 'listo') {
      loadVideos();
      return;
    }
    if (job.estado === 'rechazado' || job.estado === 'error') return;
  } catch (err) {
    actualizarSubida({ error: `Se perdió el contacto con la API: ${err.message}` });
  }
  sondeoSubida = setTimeout(sondearTrabajo, 2000);
}

async function enviarZonas() {
  const s = state.subida;
  if (!s.rects.length) return;
  try {
    const cuerpo = {
      gondola_name: s.nombreGondola || 'Góndola subida',
      shelves: s.rects.map((r, i) => ({
        name: r.name || `Estante ${i + 1}`,
        product_category: r.categoria || null,
        x: Math.round(r.x), y: Math.round(r.y),
        width: Math.round(r.w), height: Math.round(r.h),
      })),
    };
    const res = await fetch(`${cleanBaseUrl(state.apiBaseUrl)}/uploads/${s.jobId}/zones`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      actualizarSubida({ error: e.detail || `El servidor respondió ${res.status}.` });
      return;
    }
    actualizarSubida({ paso: 'procesando', error: null, job: await res.json() });
    sondearTrabajo();
  } catch (err) {
    actualizarSubida({ error: `No se pudieron guardar las zonas: ${err.message}` });
  }
}

// --- El lienzo de calibración -------------------------------------------
// Se dibuja a mano en vez de con una libreria: son cuatro rectangulos sobre
// una imagen. Las coordenadas se guardan SIEMPRE en pixeles del frame
// original (no de la pantalla), que es lo que espera data/zones/*.json.

function pintarLienzo() {
  const lienzo = document.getElementById('lienzo-zonas');
  if (!lienzo || !imagenCalibracion) return;
  const ctx = lienzo.getContext('2d');
  const escala = lienzo.width / imagenCalibracion.naturalWidth;
  ctx.drawImage(imagenCalibracion, 0, 0, lienzo.width, lienzo.height);
  state.subida.rects.forEach((r, i) => {
    ctx.strokeStyle = '#1F6C9F';
    ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(31,108,159,0.18)';
    ctx.fillRect(r.x * escala, r.y * escala, r.w * escala, r.h * escala);
    ctx.strokeRect(r.x * escala, r.y * escala, r.w * escala, r.h * escala);
    ctx.fillStyle = '#1F6C9F';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText(`${i + 1}. ${r.name || 'sin nombre'}`, r.x * escala + 6, r.y * escala + 18);
  });
}

function initLienzoZonas() {
  const lienzo = document.getElementById('lienzo-zonas');
  if (!lienzo || state.subida.paso !== 'zonas') return;

  const dibujar = () => {
    const ancho = Math.min(lienzo.parentElement.clientWidth, imagenCalibracion.naturalWidth);
    lienzo.width = ancho;
    lienzo.height = Math.round(ancho * imagenCalibracion.naturalHeight / imagenCalibracion.naturalWidth);
    pintarLienzo();
  };

  if (!imagenCalibracion) {
    const img = new Image();
    img.onload = () => { imagenCalibracion = img; dibujar(); };
    img.onerror = () => actualizarSubida({ error: 'No pude cargar el fotograma de calibración.' });
    img.src = `${cleanBaseUrl(state.apiBaseUrl)}/uploads/${state.subida.jobId}/frame`;
    return;
  }
  dibujar();

  // Arrastrar para crear un rectangulo. Durante el arrastre NO se llama a
  // setState(): repintar todo el dashboard en cada mousemove daria tirones.
  // Solo al soltar se guarda el rectangulo y se vuelve a renderizar.
  let inicio = null;
  const aFrame = (e) => {
    const caja = lienzo.getBoundingClientRect();
    const escala = imagenCalibracion.naturalWidth / caja.width;
    return { x: (e.clientX - caja.left) * escala, y: (e.clientY - caja.top) * escala };
  };
  lienzo.onmousedown = (e) => { if (state.subida.rects.length < 4) inicio = aFrame(e); };
  lienzo.onmousemove = (e) => {
    if (!inicio) return;
    const p = aFrame(e);
    pintarLienzo();
    const ctx = lienzo.getContext('2d');
    const escala = lienzo.width / imagenCalibracion.naturalWidth;
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#9F2F2D';
    ctx.strokeRect(inicio.x * escala, inicio.y * escala, (p.x - inicio.x) * escala, (p.y - inicio.y) * escala);
    ctx.setLineDash([]);
  };
  lienzo.onmouseup = (e) => {
    if (!inicio) return;
    const p = aFrame(e);
    const r = {
      x: Math.min(inicio.x, p.x), y: Math.min(inicio.y, p.y),
      w: Math.abs(p.x - inicio.x), h: Math.abs(p.y - inicio.y),
      name: `Estante ${state.subida.rects.length + 1}`, categoria: '',
    };
    inicio = null;
    // Un clic sin arrastrar no es un estante: se ignora en vez de crear un
    // rectangulo de 2 px que despues hay que borrar a mano.
    if (r.w < 20 || r.h < 20) { pintarLienzo(); return; }
    actualizarSubida({ rects: [...state.subida.rects, r] });
  };
  lienzo.onmouseleave = () => { inicio = null; pintarLienzo(); };
}

  const marcada = state.subida.terminos[clave];
  return `
    <label class="flex items-start gap-2.5 p-3 rounded-lg border ${marcada ? 'border-[#1F6C9F]/40 bg-[#1F6C9F]/5' : 'border-[#EAEAEA] bg-white'} cursor-pointer transition-colors">

      <span class="text-xs leading-relaxed text-[#2F3437]">${texto}</span>
    </label>`;
}

function barraProgreso(pct, etiqueta) {
  return `
    <div>
      <div class="flex justify-between text-xs font-medium text-[#57534E] mb-1.5">
        <span>${esc(etiqueta)}</span><span class="tabular-nums">${pct}%</span>

}

function cuerpoSubida() {
  const s = state.subida;
  const err = s.error ? `
    <div class="p-3 rounded-lg border border-[#9F2F2D]/30 bg-[#9F2F2D]/5 text-xs text-[#9F2F2D] leading-relaxed">${esc(s.error)}</div>` : '';

  if (s.paso === 'terminos') {
    return `
      ${err}
      <div class="space-y-2">
        ${casillaTermino('gondola', 'Declaro que el video muestra una <strong>góndola o lineal de tienda</strong> y a sus clientes, y que tengo autorización para analizarlo.')}
        ${casillaTermino('privacidad', 'Entiendo que el sistema <strong>no identifica personas</strong>: no reconoce rostros, no infiere edad, género ni emociones. Solo cuenta siluetas y mide permanencia e interacción.')}
        ${casillaTermino('custodia', 'Entiendo que el video se guarda <strong>en esta máquina</strong> (<code>data/videos/</code>), no se sube a internet, y que si la revisión previa lo rechaza <strong>se borra en el acto</strong>.')}
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#57534E] mb-1.5">Archivo de video</label>
        <input type="file" id="archivo-subida" accept="video/mp4,video/quicktime,video/x-msvideo,video/*"
               class="block w-full text-xs text-[#2F3437] file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-[#F3F2EF] file:text-[#2F3437] hover:file:bg-[#EAEAEA] cursor-pointer">
        ${s.archivo ? `<p class="text-[11px] text-[#787774] mt-1.5">${esc(s.archivo.name)} · ${(s.archivo.size / 1048576).toFixed(1)} MB</p>` : ''}
      </div>
      <p class="text-[11px] text-[#787774] leading-relaxed">
        Antes de procesarlo, el sistema revisa que el archivo abra, que dure entre 5 s y 15 min, y que
        <strong>YOLO encuentre personas</strong> en una muestra de 24 fotogramas. No comprueba que sea una góndola:
        eso no lo puede saber un detector de objetos, y por eso lo declaras tú arriba.
      </p>`;
  }

  if (s.paso === 'subiendo') return `${err}${barraProgreso(s.pct, 'Subiendo el archivo...')}`;

  if (s.paso === 'revisando') {
    return `
      ${err}
      <div class="flex items-center gap-3 text-sm text-[#2F3437]">
        ${icon('refresh-cw', 'w-4 h-4 animate-spin text-[#1F6C9F]')}
        <span>Revisando el video con YOLO (24 fotogramas repartidos)...</span>
      </div>`;
  }

  if (s.paso === 'rechazado') {
    return `
      <div class="p-4 rounded-lg border border-[#9F2F2D]/30 bg-[#9F2F2D]/5">
        <p class="text-sm font-bold text-[#9F2F2D] mb-1">Video no apto</p>
        <p class="text-xs text-[#2F3437] leading-relaxed">${esc(s.error || (s.job && s.job.mensaje) || 'Sin motivo.')}</p>
      </div>
      <p class="text-[11px] text-[#787774]">El archivo ya se borró de <code>data/videos/</code>.</p>`;
  }

  if (s.paso === 'zonas') {
    const d = (s.job && s.job.detalles) || {};
    const aviso = d.frame_con_personas ? `
      <div class="p-2.5 rounded-lg border border-[#956400]/30 bg-[#956400]/5 text-[11px] text-[#956400] leading-relaxed">
        Este video no tiene ningún fotograma sin gente, así que el fondo muestra personas reales.
        No se guarda ni se comparte: solo se usa aquí para que puedas ubicar los estantes.
      </div>` : `
      <div class="p-2.5 rounded-lg border border-[#346538]/30 bg-[#346538]/5 text-[11px] text-[#346538] leading-relaxed">
        El fondo es un fotograma <strong>sin ninguna persona detectada</strong>, elegido a propósito para calibrar sin mirar a nadie.
      </div>`;
    const lista = s.rects.length ? s.rects.map((r, i) => `
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-bold text-[#1F6C9F] w-4 shrink-0">${i + 1}</span>
        <input type="text" data-rect-nombre="${i}" value="${esc(r.name)}" placeholder="Nombre del estante"
               class="flex-1 min-w-0 px-2 py-1 text-xs border border-[#EAEAEA] rounded-md bg-white">
        <input type="text" data-rect-categoria="${i}" value="${esc(r.categoria || '')}" placeholder="categoría"

        <button type="button" data-action="borrar-rect" data-indice="${i}"

      </div>`).join('') : `<p class="text-[11px] text-[#787774]">Todavía no has dibujado ningún estante.</p>`;

    return `
      ${err}${aviso}
      <p class="text-xs text-[#2F3437] leading-relaxed">
        <strong>Arrastra sobre la imagen</strong> para marcar el <strong>área del piso</strong> por donde la gente camina
        frente a cada estante (no los productos: a las personas se las ubica por los pies). Puedes marcar hasta 4.
      </p>
      <div class="rounded-lg border border-[#EAEAEA] overflow-hidden bg-[#F3F2EF]">
        <canvas id="lienzo-zonas" class="block w-full cursor-crosshair"></canvas>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[#57534E] mb-1.5">Nombre de la góndola</label>
        <input type="text" id="nombre-gondola" value="${esc(s.nombreGondola)}"
               class="w-full px-2.5 py-1.5 text-xs border border-[#EAEAEA] rounded-md bg-white">
      </div>
      <div class="space-y-2">${lista}</div>
      <p class="text-[11px] text-[#787774]">
        Resolución del video: ${d.width || '?'}×${d.height || '?'} px · ${d.duration_s || '?'} s ·
        personas en ${d.frames_con_personas || 0}/${d.frames_muestreados || 0} fotogramas muestreados.
      </p>`;
  }

  if (s.paso === 'procesando') {
    const job = s.job || {};
    const etapa = job.etapa ? `Etapa: ${job.etapa}` : 'Preparando...';
    return `
      ${err}
      ${barraProgreso(job.progreso || 0, etapa)}
      <p class="text-xs text-[#2F3437] leading-relaxed">${esc(job.mensaje || '')}</p>
      <p class="text-[11px] text-[#787774] leading-relaxed">
        La cadena completa (detect → track → zones → interact → metrics) tarda varios minutos en CPU.
        Puedes cerrar esta ventana: el procesado sigue en el servidor y el video aparecerá en el selector al terminar.
      </p>`;
  }

  // listo
  return `
    <div class="p-4 rounded-lg border border-[#346538]/30 bg-[#346538]/5">
      <p class="text-sm font-bold text-[#346538] mb-1">Video procesado</p>
      <p class="text-xs text-[#2F3437] leading-relaxed">Ya está importado y disponible en el selector, con sus métricas, mapa de calor y video anonimizado.</p>
    </div>`;
}

      class="px-4 py-2 bg-[#111111] text-white rounded-lg text-xs font-semibold hover:bg-[#2F3437] disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Subir y revisar</button>`,
    rechazado: `<button type="button" data-action="subida-reiniciar" class="px-4 py-2 bg-[#111111] text-white rounded-lg text-xs font-semibold hover:bg-[#2F3437] transition-colors">Probar con otro video</button>`,
    zonas: `<button type="button" data-action="subida-zonas" ${!s.rects.length ? 'disabled' : ''}

            <p class="text-xs text-slate-500">Condiciones de uso · revisión previa · calibración · análisis</p>
          </div>
        </div>
        <button type="button" data-action="subida-cerrar" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200 transition-colors" aria-label="Cerrar ventana">${icon('x', 'w-4 h-4')}</button>
      </div>
      <div class="p-6 space-y-4 overflow-y-auto">${cuerpoSubida()}</div>
      <div class="px-6 py-3.5 border-t border-slate-100 bg-slate-50/70 flex justify-end gap-2 shrink-0">
        <button type="button" data-action="subida-cerrar" class="px-4 py-2 rounded-lg text-xs font-semibold text-[#57534E] hover:bg-[#EAEAEA] transition-colors">Cerrar</button>
        ${acciones}
      </div>
    </div>
  </div>`;
}

let hasAnimatedIn = false;
let lastCountedVideoId = null;

function render() {
  const root = document.getElementById('root');
  // La clase vive en <html>, no en #root: #root se reconstruye entero en
  // cada render() (ver comentario grande mas arriba), pero el CSS de modo
  // oscuro esta escrito contra "html.dark ..." para que siga aplicando
  // aunque #root cambie de contenido -incluida la pantalla de bienvenida-.
  document.documentElement.classList.toggle('dark', state.darkMode);

  if (state.mostrandoInicio) {
    root.innerHTML = renderPantallaInicio();
    return;
  }

  const errorBlocks = [
    state.errorVideos ? errorAlert({ title: 'Error al consultar lista de videos (/videos)', detail: state.errorVideos, retryAction: 'refresh-videos', isRetrying: state.isLoadingVideos }) : '',
    state.errorDetail ? errorAlert({ title: `Error al consultar video ${esc(state.selectedVideoId)} (/videos/${esc(state.selectedVideoId)})`, detail: state.errorDetail, retryAction: 'retry-detail', isRetrying: state.isLoadingDetail }) : '',
  ].join('');

  const firstPaint = !hasAnimatedIn && !!state.videoDetail;

  // Sin video elegido -a proposito no se auto-elige ninguno, ver
  // loadVideos()-, no tiene sentido mostrar tarjetas de zonas/mapa de
  // calor/etc. todas vacias: se corta ahi con un solo mensaje central.
  const sinVideoElegido = !state.selectedVideoId && !state.isLoadingVideos;

  const mainContent = state.mostrandoComparacion
    ? renderComparisonView()
    : `
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 space-y-4 ${firstPaint ? 'stagger-in' : ''}">
      ${renderVideoSelector()}
      ${errorBlocks}
      ${sinVideoElegido ? `
      <div class="bg-white rounded-xl border border-dashed border-[#D6D3D1] py-16 text-center">
        ${icon('layers', 'w-8 h-8 text-[#A8A29E] mx-auto mb-3')}
        <h3 class="text-sm font-semibold text-[#2F3437]">Elige un video arriba para ver su análisis</h3>
        <p class="text-xs text-[#787774] mt-1">El panel no elige uno por ti — selecciona uno del desplegable "Video".</p>
      </div>` : `
      ${renderVideoPlayer()}
      ${renderSummaryCards()}
      <!-- Columna izquierda (8/12): tabla y mapa de calor, los datos "crudos".
           Columna derecha (4/12): tarjeta de rechazo + privacidad + el
           diagnostico automatico (renderInsights), que se movio aqui a
           proposito para dejar la izquierda solo con datos, sin texto. -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
        <div class="lg:col-span-8 space-y-4">
          ${renderZonesSection()}
          ${renderPositionsHeatmap()}
          ${renderZonesHeatmap()}
          ${renderFeedback()}
        </div>
        <div class="lg:col-span-4 space-y-4">
          ${renderSidebar()}
          ${renderInsights()}
        </div>
      </div>`}
    </main>`;

  root.innerHTML = `
    <div class="no-imprimir">${renderHeader()}</div>
    <div class="no-imprimir">${renderConnectionBanner()}</div>
    ${mainContent}
    <footer class="no-imprimir bg-white border-t border-[#EAEAEA] py-3.5 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center text-xs text-[#787774]">
        <p>Góndola Inteligente · Consola de analítica de video para space management y planogramas.</p>
      </div>
    </footer>
  `;

  // Los modales van en #modals-portal, HERMANO de #root, no dentro de
  // root.innerHTML: ver el comentario grande de #modals-portal, junto al
  // <body>, sobre por que tenian que salir de ahi para quedar de verdad
  // por encima del portal del video.
  document.getElementById('modals-portal').innerHTML = renderConfigModal() + renderSubidaModal();

  if (firstPaint) hasAnimatedIn = true;
  fillCountUps();

  // Tailwind (CDN) inyecta el CSS de las clases nuevas de forma asincrona
  // -no esta listo en el mismo tick en que se reemplaza root.innerHTML-,
  // asi que medir posiciones (getBoundingClientRect, container.clientWidth)
  // justo aqui puede leer un layout todavia sin estilos aplicados: el
  // reproductor de video quedaba flotando en un sitio equivocado (bug
  // real, visto en pantalla) porque se posicionaba contra ese layout a
  // medias. Un doble requestAnimationFrame espera a que el navegador ya
  // haya pintado con los estilos puestos antes de medir nada.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (state.mostrandoComparacion) {
      pintarHeatmap('positions-heatmap-canvas-a', state.compareAPositions);
      pintarHeatmap('positions-heatmap-canvas-b', state.compareBPositions);
    } else {
      pintarHeatmap('positions-heatmap-canvas', state.positions);
    }
    initVideoPlayer();
    initLienzoZonas();
  }));
}

function fillCountUps() {
  const isNewVideo = state.videoDetail && state.videoDetail.video_id !== lastCountedVideoId;
  document.querySelectorAll('[data-count-target]').forEach((el) => {
    const target = Number(el.dataset.countTarget);
    if (isNewVideo) animateCount(el, target, 650);
    else el.textContent = formatNumber(target);
  });
  if (state.videoDetail) lastCountedVideoId = state.videoDetail.video_id;
}

function animateCount(el, to, duration) {
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = t <= 0 ? 0 : 1 - Math.pow(2, -10 * t);
    el.textContent = formatNumber(Math.round(to * eased));
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = formatNumber(to);
  }
  requestAnimationFrame(tick);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'entrar-panel') {
    // pushState (via el hash), no replaceState: asi el navegador crea una
    // entrada de historial de verdad, y el boton ATRAS tiene a donde volver
    // -antes sacaba de la pagina entera, porque nunca se habia agregado
    // nada al historial-.
    history.pushState(null, '', '#/panel');
    setState({ mostrandoInicio: false });
  }
  else if (action === 'exportar-pdf') window.print();
  else if (action === 'exportar-csv') exportarCSV();
  else if (action === 'open-settings') setState({ isConfigModalOpen: true, configTest: null, configUrlDraft: null });
  else if (action === 'toggle-dark-mode') {
    const nuevo = !state.darkMode;
    localStorage.setItem('gondola_dark_mode', String(nuevo));
    setState({ darkMode: nuevo });
  }
  else if (action === 'close-settings') setState({ isConfigModalOpen: false, configTest: null, configUrlDraft: null });
  else if (action === 'refresh-videos') loadVideos();
  else if (action === 'retry-detail') loadVideoDetail(state.selectedVideoId);
  else if (action === 'retry-health') verifyHealth();
  else if (action === 'enable-mock') toggleMockMode(true);
  else if (action === 'toggle-mock-in-modal') toggleMockMode(!state.useMockMode);
  else if (action === 'zones-view-table') setState({ zonesViewMode: 'table' });
  else if (action === 'zones-view-cards') setState({ zonesViewMode: 'cards' });
  else if (action === 'abrir-comparacion') {
    setState({ mostrandoComparacion: true });
    if (!state.compareA && state.selectedVideoId) loadCompareData('A', state.selectedVideoId);
  }
  else if (action === 'cerrar-comparacion') setState({ mostrandoComparacion: false });
  else if (action === 'abrir-subida') abrirSubida();
  else if (action === 'subida-cerrar') cerrarSubida();
  else if (action === 'subida-reiniciar') abrirSubida();
  else if (action === 'subida-enviar') subirVideo();
  else if (action === 'subida-zonas') enviarZonas();
  else if (action === 'borrar-rect') {
    const i = Number(el.dataset.indice);
    actualizarSubida({ rects: state.subida.rects.filter((_, n) => n !== i) });
  }
  else if (action === 'subida-ver') {
    const id = state.subida.job && state.subida.job.video_id;
    cerrarSubida();
    if (id) { setState({ selectedVideoId: id }); selectVideo(id); }
  }
  else if (action === 'reset-default-url') { setState({ configUrlDraft: DEFAULT_API_BASE_URL }); }
  else if (action === 'test-connection') {
    const url = document.getElementById('api-base-url-input').value;
    setState({ configTesting: true, configTest: null, configUrlDraft: url });
    try {
      const res = await checkBackendHealth(url);
      setState({ configTesting: false, configTest: { success: true, message: `Conexión exitosa: GET /health respondió status "${res.status}"` } });
    } catch (err) {
      setState({ configTesting: false, configTest: { success: false, message: `No se pudo conectar: ${err.message}. Asegúrate de que el backend FastAPI esté corriendo en ${url}.` } });
    }
  }
  else if (action === 'save-settings') {
    const url = document.getElementById('api-base-url-input').value.trim();
    localStorage.setItem('gondola_api_base_url', url);
    state.apiBaseUrl = url;
    state.isConfigModalOpen = false;
    state.configTest = null;
    state.configUrlDraft = null;
    render();
    verifyHealth();
    loadVideos();
  }
});

document.addEventListener('input', (e) => {
  // Sin render() aqui a proposito: solo guarda lo que la persona ya ve
  // escrito, para que un setState() disparado por otra cosa (el fetch de
  // "Probar", por ejemplo) no lo borre. Ver el docstring de configUrlDraft.
  if (e.target.id === 'api-base-url-input') state.configUrlDraft = e.target.value;
  // Los nombres de los estantes y de la gondola se guardan SIN render(),
  // por el mismo motivo que la URL de arriba: repintar en cada tecla
  // reconstruiria el input y se perderia el cursor a media palabra.
  else if (e.target.id === 'nombre-gondola') state.subida.nombreGondola = e.target.value;
  else if (e.target.dataset.rectNombre !== undefined) {
    const r = state.subida.rects[Number(e.target.dataset.rectNombre)];
    if (r) { r.name = e.target.value; pintarLienzo(); }
  }
  else if (e.target.dataset.rectCategoria !== undefined) {
    const r = state.subida.rects[Number(e.target.dataset.rectCategoria)];
    if (r) r.categoria = e.target.value;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'video-select') selectVideo(e.target.value);
  else if (e.target.id === 'archivo-subida') actualizarSubida({ archivo: e.target.files[0] || null, error: null });
  else if (e.target.dataset.termino) {
    actualizarSubida({ terminos: { ...state.subida.terminos, [e.target.dataset.termino]: e.target.checked } });
  }
  else if (e.target.dataset.compareSlot) loadCompareData(e.target.dataset.compareSlot, e.target.value);
  else if (e.target.id === 'heatmap-style-select') {
    localStorage.setItem('gondola_heatmap_style', e.target.value);
    setState({ heatmapStyle: e.target.value });
  }
});

// #/inicio y #/panel: si se abre sin hash (el caso normal, doble clic en
// el archivo), se deja #/inicio de una vez como punto de partida del
// historial -asi el ATRAS desde el panel tiene una entrada real a la que
// volver, no una URL vacia-. replaceState, no pushState: es la carga
// inicial, no una navegacion, asi que no debe crear una entrada nueva.
if (!location.hash) history.replaceState(null, '', '#/inicio');

// ATRAS/ADELANTE del navegador entre #/inicio y #/panel: sincroniza el
// estado con lo que diga el hash AHORA, sin volver a empujar nada al
// historial (eso ya lo hizo pushState en 'entrar-panel', o el navegador
// mismo al navegar) -si se llamara a setState() con un pushState adentro
// aqui, cada ATRAS empujaria una entrada NUEVA en vez de usar la que ya
// existia, y el boton quedaria atascado sin poder salir nunca.
window.addEventListener('popstate', () => {
  setState({ mostrandoInicio: location.hash !== '#/panel' });
});

render();
verifyHealth();
loadVideos();
initPageParticles();
</script>
</body>
</html>
