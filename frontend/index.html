<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Góndola Inteligente</title>
<meta name="description" content="Dashboard de analítica de comportamiento y space management en góndolas de supermercado." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind se sirve LOCAL a proposito, no desde cdn.tailwindcss.com: hay
     redes (campus, corporativas) cuyo DNS se niega a resolver ese dominio
     -"Query refused"-, y sin Tailwind la pagina se ve sin un solo estilo,
     bug real reportado por un companero de equipo en otra maquina/red. Es
     la version 3.4.17 exacta, la que servia el Play CDN: la v3 hace falta
     porque el tailwind.config de aqui abajo es formato v3 (la v4 configura
     con @theme en CSS). Ver frontend/README.md. -->
<script src="vendor/tailwindcss-3.4.17.js"></script>
<link rel="stylesheet" href="css/estilos.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: {
            50: '#fafaf9', 100: '#f5f5f4', 200: '#e7e5e4', 300: '#d6d3d1',
            400: '#a8a29e', 500: '#78716c', 600: '#57534e', 700: '#44403c',
            800: '#292524', 900: '#1c1917', 950: '#0c0a09',
          },
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/heatmap.js@2.0.5/build/heatmap.min.js"></script>
</head>
<body class="app-bg text-[#2F3437] antialiased">
<!-- Fondo animado de constelacion (particulas + lineas), para TODO el
     dashboard. Vive FUERA de #root a proposito -como el portal del video,
     ver el comentario de mas abajo-: render() reemplaza el HTML de #root
     en cada cambio de estado, y si el <canvas> estuviera adentro la
     animacion se reiniciaria (perdiendo sus particulas) cada vez que el
     usuario cambia de video o abre un modal. Aqui afuera se crea y arranca
     UNA sola vez (ver initPageParticles(), en js/particulas.js) y nunca se
     toca. Fusionado desde una version paralela del dashboard que trajo
     esta animacion; #root sube a z-index:1 para quedar SIEMPRE encima. -->
<canvas id="page-particles" style="position:fixed;top:0;left:0;z-index:0;pointer-events:none;"></canvas>
<div id="root" class="min-h-screen flex flex-col relative" style="z-index:1"></div>

<!-- "Portal" del reproductor de video: vive FUERA de #root a proposito.
     #root se reconstruye entero (root.innerHTML = ...) en cada render(), y
     eso incluye cualquier nodo que estuviera adentro -un <video> a mitad de
     descargar 15+ MB se interrumpe si su nodo se destruye, aunque sea por
     una fraccion de segundo, y el navegador lo reporta como error aunque el
     servidor haya respondido bien (bug real, visto en DevTools: 3 peticiones
     /render con 206 cada una, todas interrumpidas). Este div se posiciona
     por JS (ver initVideoPlayer(), en js/reproductor.js) exactamente encima
     del hueco que deja el placeholder dentro de #root, pero el <video> en
     si nunca vive ahi adentro: nunca se destruye por un render(), sin
     importar cuantos ocurran mientras esta cargando.

     Con un modal abierto (configuracion o subir video) los dos portales se
     esconden en vez de reposicionarse (ver initVideoPlayer()): #root tiene
     position:relative + z-index:1, y eso lo convierte en su PROPIO contexto
     de apilamiento, asi que el z-50 de un modal -aunque generoso- nunca
     puede ganarle a un HERMANO de #root como estos portales. Esconder el
     video mientras hay modal es mas simple que sacar tambien los modales a
     su propio hermano con mayor z-index -bug real, reportado por un
     companero de equipo: el video quedaba flotando sobre la portada y
     atravesando los modales-. -->
<div id="video-player-portal" hidden style="position:absolute; z-index:5;"></div>
<div id="video-compare-b-portal" hidden style="position:absolute; z-index:5;"></div>

<!-- EL ORDEN DE ESTOS <script> IMPORTA.
     Son scripts CLASICOS, no modulos ES (`type="module"`), a proposito: este
     archivo se abre con doble clic (file://...), y los navegadores BLOQUEAN
     los modulos ES desde file:// por politica CORS -la pagina quedaria en
     blanco sin levantar un servidor-. Con scripts clasicos comparten un solo
     ambito global, igual que cuando todo esto vivia en un unico <script>.

     Por eso el orden importa: hay codigo de nivel superior que se ejecuta
     al cargar (`const state = ...` llama a rutaActual()/SUBIDA_VACIA(),
     `const reproductorA = ...` llama a crearReproductorPersistente(), y la
     ultima linea de app.js llama a render()/arrancar()), y una funcion o
     constante declarada en un archivo posterior todavia no existe. Si
     mueves uno de sitio, compruebalo. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/datos-demo.js"></script>
<script src="js/api.js"></script>
<script src="js/estado.js"></script>
<script src="js/vista-panel.js"></script>
<script src="js/reproductor.js"></script>
<script src="js/analisis.js"></script>
<script src="js/vista-comparar.js"></script>
<script src="js/vista-zonas.js"></script>
<script src="js/subida.js"></script>
<script src="js/vista-modales.js"></script>
<script src="js/particulas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
